<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveling Prairie Wolf - Destination Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link href = "./css/style.css" rel="stylesheet" />
</head>
<body>
    <!-- Site navigation: Bootstrap navbar copied onto all four pages.
     The logo links to Home. On narrow screens the links collapse into a
     hamburger menu, which depends on the Bootstrap JS bundle at the bottom of the page.
     On each page, "active" and aria-current="page" go on that page's own link. -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="./images/Primary_GoldBlack_RGB.png" height="70" class="d-inline-block align-text-top" alt="Nebraska Wesleyan University logo featuring an interlocking NW monogram above the university name."/>
            </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="absence-emails.html">Absence Emails</a>
                    <a class="nav-link active" aria-current="page" href="destination-weather.html">Destination Weather</a>
                    <a class="nav-link" href="key-dates-and-deadlines.html">Key Dates and Deadlines</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Bootstrap layout centers the page content and adds margins, mt-4 adds space at top -->
    <div class="container mt-4">
        <!-- Main content for the Destination Weather page: using event date and destination saved in localStorage, 
        weather forecast (currently just temps) for morning, afternoon, evening and destination map shown. -->
        <main>
            <!-- Page introduction: feature name and one-line purpose -->
            <h1>Destination Weather</h1>
            <p>This page will show destination weather and location.</p> 
            
            <div class="row g-3">
                <section class="col-md-6">
                    <!-- Event Day Forecast: morning, afternoon and evening weather at the trip destination,
                    from the Open-Meteo API for the travel dates saved in localStorage. -->
                    <h2>Event Day</h2>
                    <p id="weather-message"></p>
                    <div>
                        <h3>Morning (10:00 a.m.)</h3>
                        <p id="morning-forecast"></p>
                    </div>   
                    <div>
                        <h3>Afternoon (2:00 p.m.)</h3>
                        <p id="afternoon-forecast"></p>
                    </div>
                    <div>
                        <h3>Evening (6:00 p.m.)</h3>
                        <p id="evening-forecast"></p>
                    </div>
                </section>
                <!-- Destination Map: a map of the trip destination, planned from OpenStreetMap.
                Currently placeholder text only. -->
                <section class="col-md-6">
                    <h2>Destination Map</h2>
                    <p>Map showing event location (with link to Google Maps?).</p>
                 </section>
            </div>

            

        </main>
        
        <!-- TODO - identify and build content -->
        <footer></footer>
    </div>
    
    <!-- Scripts load last so the page content exists first. The Bootstrap bundle powers
     the navbar's hamburger menu and must come before our own script.js. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>  
</body>
</html>
